<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pizza Rush</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #2b2b2b;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    canvas {
      display: block;
      width: auto;
      height: auto;
      max-width: 96vw;
      max-height: 96vh;
      background: #FFF3E0;
      touch-action: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="640"></canvas>
  <script src="game.js"></script>
</body>
</html>
