<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>몬스터 배틀 아레나 · 엔진 테스트</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 20px 60px;
      background: #10121f;
      color: #e8ecff;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p.lead { margin: 0 0 22px; color: #9aa3bd; font-size: 13px; line-height: 1.6; }
    #summary {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      background: #232a46;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    #summary.pass { background: #173a24; border-color: #3e8a55; color: #9df0b0; }
    #summary.fail { background: #3a1a1e; border-color: #8a3e47; color: #ffb3b8; }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      gap: 10px;
      align-items: baseline;
      padding: 9px 12px;
      margin-bottom: 6px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      font-size: 13px;
      line-height: 1.45;
    }
    li .mark { flex: none; width: 18px; font-weight: 900; }
    li.pass .mark { color: #7fe39a; }
    li.fail { background: rgba(160, 50, 60, 0.18); }
    li.fail .mark { color: #ff9aa2; }
    li .detail { color: #98a1bb; font-size: 12px; }
    footer { margin-top: 26px; color: #6f7894; font-size: 12px; }
    a { color: #8fb4ff; }
  </style>
</head>
<body>
  <main>
    <h1>엔진 테스트</h1>
    <p class="lead">
      전투 계산, 상성, 경험치, AI 선택 로직을 검증합니다.
      외부 라이브러리 없이 브라우저에서 바로 실행됩니다.
    </p>
    <div id="summary">실행 중…</div>
    <ul id="results"></ul>
    <footer>
      <a href="index.html">← 게임으로 돌아가기</a> ·
      테스트는 게임 데이터(<code>js/data.js</code>)와 엔진(<code>js/engine.js</code>)만 사용합니다.
    </footer>
  </main>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script>
    (function () {
      'use strict';

      const Data = window.GameData;
      const Engine = window.Engine;
      const list = document.getElementById('results');
      const summary = document.getElementById('summary');
      let passed = 0;
      let failed = 0;

      function test(name, fn) {
        try {
          fn();
          passed += 1;
          addRow(true, name);
        } catch (error) {
          failed += 1;
          addRow(false, name, error && error.message ? error.message : String(error));
        }
      }

      function addRow(ok, name, detail) {
        const li = document.createElement('li');
        li.className = ok ? 'pass' : 'fail';
        const mark = document.createElement('span');
        mark.className = 'mark';
        mark.textContent = ok ? '✓' : '✗';
        const body = document.createElement('span');
        body.textContent = name;
        if (detail) {
          const d = document.createElement('span');
          d.className = 'detail';
          d.textContent = ' — ' + detail;
          body.appendChild(d);
        }
        li.appendChild(mark);
        li.appendChild(body);
        list.appendChild(li);
      }

      function assert(condition, message) {
        if (!condition) throw new Error(message || '조건 불충족');
      }

      function assertEqual(actual, expected, message) {
        if (actual !== expected) {
          throw new Error((message || '값 불일치') + ' (기대 ' + expected + ', 실제 ' + actual + ')');
        }
      }

      function assertClose(actual, expected, tolerance, message) {
        if (Math.abs(actual - expected) > tolerance) {
          throw new Error((message || '값 불일치') + ' (기대 ' + expected + '±' + tolerance + ', 실제 ' + actual + ')');
        }
      }

      // 고정 난수 시퀀스로 결과를 재현 가능하게 만든다.
      function seeded(values) {
        let i = 0;
        return function () {
          const value = values[i % values.length];
          i += 1;
          return value;
        };
      }

      test('상성표: 불 → 풀 2배, 불 → 불 0.5배', () => {
        assertEqual(Engine.typeMultiplier('fire', 'grass'), 2);
        assertEqual(Engine.typeMultiplier('fire', 'fire'), 0.5);
      });

      test('상성표: 물 → 불 2배, 풀 → 물 2배', () => {
        assertEqual(Engine.typeMultiplier('water', 'fire'), 2);
        assertEqual(Engine.typeMultiplier('grass', 'water'), 2);
      });

      test('상성표: 노말은 모든 타입에 1배', () => {
        ['fire', 'water', 'grass', 'normal'].forEach((type) => {
          assertEqual(Engine.typeMultiplier('normal', type), 1);
        });
      });

      test('몬스터 생성: 레벨·능력치·기술 4개', () => {
        const mon = Engine.createMonster('emberpup', 5);
        assertEqual(mon.level, 5);
        assertEqual(mon.speciesId, 'emberpup');
        assertEqual(mon.moves.length, 4);
        assertEqual(mon.hp, mon.maxHp);
        assert(mon.stats.hp > 0 && mon.stats.atk > 0, '능력치는 양수여야 함');
      });

      test('몬스터 생성: 레벨 범위 1~20으로 제한', () => {
        assertEqual(Engine.createMonster('aquabble', 0).level, 1);
        assertEqual(Engine.createMonster('aquabble', 99).level, Engine.LEVEL_CAP);
      });

      test('대미지: 최소 1 이상, 유효 상성은 더 큰 피해', () => {
        const attacker = Engine.createMonster('aquabble', 5);
        const weakTarget = Engine.createMonster('emberpup', 5);
        const strongTarget = Engine.createMonster('sproutle', 5);
        const move = Data.MOVES.aqua_jet;

        const roll = seeded([0.5, 0.5, 0.5]);
        const vsFire = Engine.calcDamage(attacker, weakTarget, move, roll);
        const vsGrass = Engine.calcDamage(attacker, strongTarget, move, seeded([0.5, 0.5, 0.5]));

        assertEqual(vsFire.effectiveness, 2);
        assertEqual(vsGrass.effectiveness, 0.5);
        assert(vsFire.damage > vsGrass.damage, '물→불 피해가 물→풀보다 커야 함');
        assert(vsGrass.damage >= 1, '대미지는 최소 1');
      });

      test('대미지: 급소 판정 시 1.5배 이상', () => {
        const a = Engine.createMonster('emberpup', 8);
        const d = Engine.createMonster('pebblit', 8);
        const move = Data.MOVES.flame_paw;
        const normal = Engine.calcDamage(a, d, move, seeded([0.99, 0.5, 0.5]));
        const crit = Engine.calcDamage(a, d, move, seeded([0.01, 0.5, 0.5]));
        assert(!normal.crit, '일반 타격은 급소가 아니어야 함');
        assert(crit.crit, '급소 판정이어야 함');
        assert(crit.damage > normal.damage, '급소 피해가 더 커야 함');
      });

      test('명중 판정: 명중률 경계값', () => {
        const move = { accuracy: 90 };
        assert(Engine.accuracyCheck(move, () => 0.89), '89%는 명중');
        assert(!Engine.accuracyCheck(move, () => 0.91), '91%는 빗나감');
      });

      test('경험치: 레벨업과 잔여 경험치 계산', () => {
        const need = Engine.expToNext(5);
        const result = Engine.gainExp(5, 0, need + 5);
        assertEqual(result.level, 6);
        assertEqual(result.gained, 1);
        assertEqual(result.exp, 5);
      });

      test('경험치: 최고 레벨에서는 더 오르지 않음', () => {
        const result = Engine.gainExp(Engine.LEVEL_CAP, 0, 99999);
        assertEqual(result.level, Engine.LEVEL_CAP);
        assertEqual(result.exp, 0);
      });

      test('경험치: 처치 경험치는 적 레벨에 비례', () => {
        assertEqual(Engine.expGain(1), 54);
        assertEqual(Engine.expGain(5), 110);
        assert(Engine.expGain(10) > Engine.expGain(5), '높은 레벨이 더 많은 경험치');
      });

      test('턴 순서: 속도가 높은 쪽이 먼저', () => {
        const fast = Engine.createMonster('voltwisp', 10);
        const slow = Engine.createMonster('pebblit', 10);
        assertEqual(Engine.turnOrder(fast, slow), 'a');
        assertEqual(Engine.turnOrder(slow, fast), 'b');
      });

      test('AI: 합리적인 기술을 선택한다', () => {
        const ai = Engine.createMonster('emberpup', 10);
        const target = Engine.createMonster('sproutle', 10);
        const move = Engine.chooseAiMove(ai, target, seeded([0.9]));
        assert(move && move.id, '기술을 반환해야 함');
        assert(ai.moves.indexOf(move.id) >= 0, '보유한 기술이어야 함');
      });

      test('AI: 모든 기술의 명중률이 0~100 범위', () => {
        Object.keys(Data.MOVES).forEach((id) => {
          const move = Data.MOVES[id];
          assert(move.power > 0, id + ' 위력은 양수');
          assert(move.accuracy > 0 && move.accuracy <= 100, id + ' 명중률 범위');
        });
      });

      test('데이터 무결성: 6종 몬스터, 12개 기술, 6개 스테이지', () => {
        assertEqual(Object.keys(Data.SPECIES).length, 6);
        assertEqual(Object.keys(Data.MOVES).length, 12);
        assertEqual(Data.STAGES.length, 6);
      });

      test('데이터 무결성: 모든 몬스터 기술과 타입이 존재', () => {
        Data.SPECIES_ORDER.forEach((id) => {
          const species = Data.SPECIES[id];
          assert(Data.TYPES[species.type], id + ' 타입 누락');
          assertEqual(species.moves.length, 4);
          species.moves.forEach((moveId) => {
            assert(Data.MOVES[moveId], id + ' 기술 누락: ' + moveId);
          });
        });
      });

      test('데이터 무결성: 스테이지 해금 몬스터가 모두 존재', () => {
        Data.STAGES.forEach((stage) => {
          assert(Data.SPECIES[stage.enemy], '적 몬스터 누락: ' + stage.enemy);
          if (stage.unlock) {
            assert(Data.SPECIES[stage.unlock], '해금 몬스터 누락: ' + stage.unlock);
          }
        });
      });

      test('스테이지 난이도 곡선: 적 레벨이 단조 증가', () => {
        for (let i = 1; i < Data.STAGES.length; i += 1) {
          assert(
            Data.STAGES[i].level > Data.STAGES[i - 1].level,
            '스테이지 ' + (i + 1) + '의 적 레벨이 이전보다 높아야 함'
          );
        }
      });

      summary.className = failed === 0 ? 'pass' : 'fail';
      summary.textContent = failed === 0
        ? '전체 ' + passed + '개 테스트 통과'
        : passed + '개 통과 · ' + failed + '개 실패';

      // 콘솔에서도 결과를 확인할 수 있게 한다.
      console.log('[Monster Arena tests]', { passed, failed });
    })();
  </script>
</body>
</html>
